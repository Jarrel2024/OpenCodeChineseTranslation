name: Build

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag (e.g., v1.18.2)'
        required: true
        type: string

permissions:
  contents: write

env:
  UPSTREAM_REPO: anomalyco/opencode

jobs:
  build:
    name: Build OpenCode Chinese
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli-go/go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - run: |
          cd cli-go
          go build -o ../opencode-cli .

      - run: |
          echo "Cloning ${{ env.UPSTREAM_REPO }}@${{ github.event.inputs.upstream_tag }}"
          git clone --depth 1 --branch "${{ github.event.inputs.upstream_tag }}" https://github.com/${{ env.UPSTREAM_REPO }}.git opencode-zh-CN

      - run: |
          python3 -c "
path = 'opencode-zh-CN/packages/opencode/script/build.ts'
with open(path) as f:
    lines = f.readlines()
new_lines = []
skip = 0
for i, line in enumerate(lines):
    if skip > 0:
        skip -= 1
        continue
    stripped = line.strip()
    if stripped == '{' and i + 3 < len(lines):
        block = ''.join(lines[i:i+4])
        if '\"win32\"' in block and '\"arm64\"' in block:
            skip = 4
            continue
    new_lines.append(line)
with open(path, 'w') as f:
    f.writelines(new_lines)
print('Removed win32-arm64')
"

      - run: ./opencode-cli apply
        env:
          OPENCODE_SOURCE_DIR: ${{ github.workspace }}/opencode-zh-CN

      - run: ./opencode-cli build --platform all
        env:
          OPENCODE_SOURCE_DIR: ${{ github.workspace }}/opencode-zh-CN
