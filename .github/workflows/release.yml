name: OpenCode Chinese Build

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag (e.g., v1.18.2)'
        required: false
        type: string
      release_tag:
        description: 'Release tag for this build (defaults to upstream_tag)'
        required: false
        type: string

permissions:
  contents: write

env:
  UPSTREAM_REPO: anomalyco/opencode

jobs:
  check-upstream:
    name: Check Upstream
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          LATEST=$(curl -sL https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest | jq -r '.tag_name')
          [ -z "$LATEST" ] || [ "$LATEST" = "null" ] && { echo "upstream_tag=" >> $GITHUB_OUTPUT; exit 0; }
          LAST=""; [ -f .release-state ] && LAST=$(head -1 .release-state)
          [ "$LATEST" != "$LAST" ] && echo "upstream_tag=$LATEST" >> $GITHUB_OUTPUT || echo "upstream_tag=" >> $GITHUB_OUTPUT

  build-cli:
    name: CLI Tool
    runs-on: ubuntu-latest
    needs: check-upstream
    if: always() && (github.event_name != 'schedule' || needs.check-upstream.outputs.upstream_tag != '')
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
          - os: linux
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli-go/go.mod
      - run: |
          cd cli-go
          EXT=""; [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          go build -ldflags="-s -w" -o "../dist/opencode-cli-${{ matrix.os }}-${{ matrix.arch }}${EXT}" .
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  build-opencode:
    name: OpenCode ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: [check-upstream, build-cli]
    if: always() && (github.event_name != 'schedule' || needs.check-upstream.outputs.upstream_tag != '') && needs.build-cli.result == 'success'
    strategy:
      matrix:
        platform: [windows-x64, linux-x64, linux-arm64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli-go/go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - run: |
          cd cli-go && go build -o ../opencode-cli .

      - id: tag
        run: |
          SCHEDULE_TAG="${{ needs.check-upstream.outputs.upstream_tag }}"
          DISPATCH_UPSTREAM="${{ github.event.inputs.upstream_tag }}"
          DISPATCH_RELEASE="${{ github.event.inputs.release_tag }}"
          PUSH_TAG="${{ github.ref_name }}"
          if [ -n "$SCHEDULE_TAG" ]; then echo "upstream=$SCHEDULE_TAG" >> $GITHUB_OUTPUT; echo "release=$SCHEDULE_TAG" >> $GITHUB_OUTPUT; echo "version=${SCHEDULE_TAG#v}" >> $GITHUB_OUTPUT
          elif [ -n "$DISPATCH_UPSTREAM" ]; then echo "upstream=$DISPATCH_UPSTREAM" >> $GITHUB_OUTPUT; echo "release=${DISPATCH_RELEASE:-$DISPATCH_UPSTREAM}" >> $GITHUB_OUTPUT; echo "version=${DISPATCH_UPSTREAM#v}" >> $GITHUB_OUTPUT
          else echo "upstream=$PUSH_TAG" >> $GITHUB_OUTPUT; echo "release=$PUSH_TAG" >> $GITHUB_OUTPUT; echo "version=${PUSH_TAG#v}" >> $GITHUB_OUTPUT; fi

      - run: |
          git clone --depth 1 --branch "${{ steps.tag.outputs.upstream }}" https://github.com/${{ env.UPSTREAM_REPO }}.git opencode-zh-CN || \
          git clone --depth 1 --branch dev https://github.com/${{ env.UPSTREAM_REPO }}.git opencode-zh-CN

      - run: python3 scripts/patch-build-ts.py opencode-zh-CN/packages/opencode/script/build.ts

      - run: ./opencode-cli apply
        env:
          OPENCODE_SOURCE_DIR: ${{ github.workspace }}/opencode-zh-CN

      - run: ./opencode-cli build --platform ${{ matrix.platform }} --deploy=false
        env:
          OPENCODE_SOURCE_DIR: ${{ github.workspace }}/opencode-zh-CN
          OPENCODE_VERSION: ${{ steps.tag.outputs.version }}

      - run: |
          TAG=${{ steps.tag.outputs.release }}
          PLATFORM=${{ matrix.platform }}
          mkdir -p dist
          DIR="opencode-zh-CN/packages/opencode/dist/opencode-${PLATFORM}/bin"
          EXT=""; case "$PLATFORM" in windows*) EXT=".exe";; esac
          BINARY="$DIR/opencode$EXT"
          if [ -f "$BINARY" ]; then
            zip -j dist/opencode-zh-CN-${TAG}-${PLATFORM}.zip "$BINARY"
          else
            echo "Binary not found: $BINARY"
            find opencode-zh-CN -name "opencode*" -type f 2>/dev/null | head -20
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.platform }}
          path: dist/*.zip

  release:
    name: Publish Release
    needs: [check-upstream, build-cli, build-opencode]
    if: always() && needs.build-cli.result == 'success' && needs.build-opencode.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - id: tag
        run: |
          SCHEDULE_TAG="${{ needs.check-upstream.outputs.upstream_tag }}"
          DISPATCH_UPSTREAM="${{ github.event.inputs.upstream_tag }}"
          DISPATCH_RELEASE="${{ github.event.inputs.release_tag }}"
          PUSH_TAG="${{ github.ref_name }}"
          if [ -n "$SCHEDULE_TAG" ]; then echo "tag=$SCHEDULE_TAG" >> $GITHUB_OUTPUT
          elif [ -n "$DISPATCH_UPSTREAM" ]; then echo "tag=${DISPATCH_RELEASE:-$DISPATCH_UPSTREAM}" >> $GITHUB_OUTPUT
          else echo "tag=$PUSH_TAG" >> $GITHUB_OUTPUT; fi

      - id: date
        run: echo "ts=$(TZ=Asia/Shanghai date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Delete existing tag and release
        continue-on-error: true
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh api repos/${{ github.repository }}/releases/tags/$TAG -q '.id' 2>/dev/null | xargs -r gh api repos/${{ github.repository }}/releases/ -X DELETE
          gh api repos/${{ github.repository }}/git/refs/tags/$TAG -X DELETE 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - run: |
          TAG="${{ steps.tag.outputs.tag }}"
          zip -r "dist/opencode-i18n-tool-${TAG}.zip" cli-go/ install.ps1 install.sh README.md CHANGELOG.md -x "cli-go/.git/*" "*.exe"

      - run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          TS="${{ steps.date.outputs.ts }}"
          cat > release_notes.md <<- EOF
          ## OpenCode Chinese Edition

          **Upstream:** \`$VERSION\`
          **Built:** $TS

          | Platform | CLI | OpenCode |
          |----------|-----|----------|
          | Windows x64 | \`opencode-cli-windows-amd64.exe\` | \`opencode-zh-CN-${VERSION}-windows-x64.zip\` |
          | macOS Apple Silicon | \`opencode-cli-darwin-arm64\` | \`opencode-zh-CN-${VERSION}-darwin-arm64.zip\` |
          | macOS Intel | \`opencode-cli-darwin-amd64\` | \`opencode-zh-CN-${VERSION}-darwin-x64.zip\` |
          | Linux x64 | \`opencode-cli-linux-amd64\` | \`opencode-zh-CN-${VERSION}-linux-x64.zip\` |
          | Linux ARM64 | \`opencode-cli-linux-arm64\` | \`opencode-zh-CN-${VERSION}-linux-arm64.zip\` |

          > Windows ARM64 is not supported (Bun lacks Windows ARM64 runtime builds).

          ## Quick Install

          **Windows (PowerShell)**
          \`\`\`
          powershell -c "irm https://cdn.jsdelivr.net/gh/1186258278/OpenCodeChineseTranslation@main/install.ps1 | iex"
          \`\`\`

          **Linux / macOS**
          \`\`\`bash
          curl -fsSL https://cdn.jsdelivr.net/gh/1186258278/OpenCodeChineseTranslation@main/install.sh | bash
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OpenCode ${{ steps.tag.outputs.tag }} 汉化版 (${{ steps.date.outputs.ts }})"
          body_path: release_notes.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'schedule'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "$TAG" > .release-state
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .release-state
          git commit -m "chore: update state [skip ci]" || true
          git push || true